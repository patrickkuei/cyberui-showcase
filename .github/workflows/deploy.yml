name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Template packages first: the site's dist/live/<name>/ (below) is built
      # from each template's own dist, so it must exist before we combine them.
      # Extend this list with `pnpm --filter <pkg> run build` as new templates
      # land (spec: Hosting & CI/CD — one combined workflow, not per-package).
      - name: Build monitoring template
        run: pnpm --filter monitoring-template run build

      - name: Build site
        run: pnpm --filter cyberui-templates-site run build

      - name: Combine template builds into site/dist/live/*
        run: |
          set -e
          mkdir -p packages/site/dist/live/monitoring
          cp -r packages/monitoring/dist/. packages/site/dist/live/monitoring/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
